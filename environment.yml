name: swfc

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Numerical computing
  - numpy
  - pandas
  - scipy

  # Machine learning and statistics
  - scikit-learn
  - statsmodels

  # Research utilities
  - pyyaml
  - pytest
  - joblib
  - tqdm
  - psutil

  # Data and figures
  - openpyxl
  - matplotlib

  # Interactive development
  - jupyter
  - ipykernel

  - pip
  - pip:
      - xgboost
      - shap