# D3-B superpopulation-anchored alpha-dispersion ensemble.
# The historical alpha_stress_design_pool / 72001 block above is retained
# strictly for provenance and is not used by D3-B.
d3_alpha_dispersion_superpopulation:

  master_seed_namespace: 74001
  child_generation: "numpy.random.SeedSequence.spawn"
  total_child_worlds: 400
  initial_worlds: 200


random_weight_reference:

  master_seed: 81001

  child_generation: "numpy.random.SeedSequence"


partition_assignment:

  master_seed_offset: 91000

  rule: >
    For replication seed r, derive the nested estimation-pool
    FIT/WEIGHT assignment stream deterministically from r and
    this namespace.


context_generation:

  estimation_stream_namespace: 1001
  external_test_stream_namespace: 1002

  rule: >
    Preserve the original 1000-context estimation stream under
    namespace 1001 and generate the fixed 200-context external
    TEST pool from the separate deterministic namespace 1002.
    Both streams reuse their underlying base draws across rho.


target_noise:

  stream_namespace: 3001

  rule: >
    For replication seed r, derive one 7200-row standard-normal
    alternative-context master noise stream from r and namespace
    3001. Assign draws by sorted (context_number, alternative_id)
    identity and reuse the same base draw across N, rho, lambda,
    and c. External TEST rows receive draws but never contribute
    to signal-scale estimation or development diagnostics.


software_tests:

  smoke_test_seed: 12345


# ============================================================
# XGBoost development calibration
# Frozen before calibration execution.
# ============================================================

xgboost_calibration:
  search_random_state: 82001
  estimator_random_state: 82002
  rule: >
    82001 deterministically samples the 60 RandomizedSearchCV candidate
    configurations. 82002 is the fixed XGBRegressor random_state used for
    every candidate and fold during development calibration.

# ============================================================
# TreeSHAP background row-priority stream
# Frozen before any TreeSHAP background-size result.
# ============================================================

treeshap_background:
  row_priority_namespace: 83001
  rule: >
    For replication seed r, derive one deterministic priority ordering
    over complete N=1000 FIT alternative-context row identities from
    SeedSequence([r,83001]). For each nested N, filter the same priority
    ordering to FIT rows available at N and take the first 100 rows.
    The selected identities are reused across rho, c, and lambda and
    depend on row identity/partition membership only, never on feature,
    target, oracle, SHAP, MCDM, winner, or TEST outcomes.

# ============================================================
# XGBoost production-fit algorithmic RNG
# Frozen before the first scientific TreeSHAP weight vector.
# ============================================================

xgboost_production:
  estimator_random_state: 82002
  reuse_of: "xgboost_calibration.estimator_random_state"
  rule: >
    Reuse the already-frozen XGBoost calibration estimator random state 82002
    for every fitted XGBRegressor in the scientific pipeline. The value is held
    fixed across replication seeds, N, rho, c, lambda, development pilots, and
    bootstrap refits. This controls learner-internal stochasticity rather than
    adding a second stochastic dimension to the benchmark. Data and resampling
    variation remain governed by their own frozen seed streams.
permutation_importance:
  master_seed: 84001
  child_generation: "numpy.random.SeedSequence"
  rule: >
    For replication seed r and frozen sample size N, derive the context-block
    derangement RNG from SeedSequence([r,84001,N]). Sort WEIGHT contexts by
    context_number and index them 0..m-1. Repeatedly draw perm=rng.permutation(m)
    and accept it iff perm[d] != d for every destination d and its tuple has not
    been accepted previously. Stop after 20 unique accepted derangements; after
    100000 candidate draws without 20 accepted derangements, raise RuntimeError
    with no fallback and no PI result. For destination context position d, copy
    only the permuted criterion six-alternative block from source position
    perm[d], preserving alternative_id ascending order and leaving all other
    features unchanged. Reuse the same 20 derangements across all ten criteria
    and across rho, c, and lambda.
