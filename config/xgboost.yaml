# ============================================================
# XGBoost + TreeSHAP configuration V2
# ============================================================

model:

  library: "xgboost"

  estimator: "XGBRegressor"

  objective: "reg:squarederror"

  n_jobs: 1

  verbosity: 0


# ============================================================
# 1. Development calibration
# ============================================================

development:

  enabled: true

  data_partition: "fit"

  grouping_variable: "context_id"

  cross_validation:
    method: "GroupKFold"
    folds: 5

  optimization_metric: "RMSE"

  search:
    method: "RandomizedSearchCV"
    number_of_candidates: 60

  search_space:

    n_estimators:
      - 200
      - 400
      - 600

    max_depth:
      - 2
      - 3
      - 5

    learning_rate:
      - 0.03
      - 0.05
      - 0.10

    subsample:
      - 0.80
      - 1.00

    colsample_bytree:
      - 0.80
      - 1.00

    min_child_weight:
      - 1
      - 5

    reg_alpha:
      - 0.0
      - 0.1

    reg_lambda:
      - 1.0
      - 5.0


# ============================================================
# 2. Frozen parameters
# ============================================================
#
# These remain NULL until development calibration is complete.
# They are filled ONCE and committed before the primary runs.
# ============================================================

frozen_parameters:

  calibrated: true

  n_estimators: 600

  max_depth: 2

  learning_rate: 0.05

  subsample: 0.8

  colsample_bytree: 0.8

  min_child_weight: 5

  reg_alpha: 0.0

  reg_lambda: 1.0


# ============================================================
# 3. TreeSHAP
# ============================================================

tree_shap:

  feature_perturbation: "interventional"

  model_output: "raw"

  background:

    source_partition: "fit"

    selection: "random_without_replacement"

    calibrated: true

    calibration_mode: "prospective_fixed_choice_without_outcome_tuning"

    frozen_target_size: 100

    # Historical/provenance sensitivity sizes. They do not compete for
    # selection after this prospective freeze.
    candidate_sizes:
      - 25
      - 50
      - 75
      - 100

    candidate_set_status: "resolved_prospectively_before_background_results"
    candidate_100_now_feasible: true
    sensitivity_sizes_are_non_decision: true

    selection_basis: >
      Use the largest historically contemplated background size
      that is feasible at the smallest primary sample. This choice is
      frozen before any TreeSHAP background-size result is computed and
      cannot be changed by oracle fidelity, SHAP weight recovery, MCDM,
      winner identity, or external TEST performance.

    feasibility:

      require_all_candidates_feasible_at_smallest_primary_sample: true

      smallest_primary_estimation_context_count: 25

      fit_fraction_within_estimation_pool: 0.80

      fit_contexts_at_smallest_primary_sample: 20

      alternatives_per_context: 6

      available_fit_rows_at_smallest_primary_sample: 120

      selection_unit: "alternative_context_row"

      selection_without_replacement: true

    row_priority:

      seed_registry_key: "treeshap_background.row_priority_namespace"

      construction: >
        For replication seed r, create one deterministic random priority
        ordering over the complete N=1000 FIT alternative-context row
        identities using SeedSequence([r, row_priority_namespace]).
        For any nested N, filter that same priority ordering to FIT rows
        available at N and take the first frozen_target_size rows.

      reuse_priority_across_rho: true
      reuse_priority_across_c: true
      reuse_priority_across_lambda: true
      depends_on_feature_values: false
      depends_on_target_values: false
      depends_on_oracle_values: false
      depends_on_method_outcomes: false

    if_target_exceeds_available_rows:
      rule: "raise_error"

  explanation_partition: "weight"

  global_importance:
    definition: "mean_absolute_shap"

  local_accuracy_test:

    enabled: true

    absolute_tolerance: 1.0e-5

    relative_tolerance: 1.0e-5


# ============================================================
# 4. Permutation importance
# ============================================================

permutation_importance:

  model: "fitted_xgboost"

  evaluation_partition: "weight"

  loss: "mean_squared_error"

  repeats: 20

  permutation_unit: "context_block"

  permutation_scheme: "derangement"
  require_no_fixed_context_blocks: true
  unique_derangements_where_feasible: true

  preserve_alternative_order_within_block: true

  negative_importance:
    rule: "truncate_to_zero"

  normalization:
    rule: "divide_by_sum"


# ============================================================
# 5. Non-negative Ridge baseline
# ============================================================

ridge_plus:

  data_partition: "fit"

  standardize_X: true

  standardize_y: true

  solver: "scipy_optimize_nnls_augmented_design"

  coefficient_constraint: "nonnegative"

  regularization_selection:

    method: "GroupKFold"

    folds: 5

    grouping_variable: "context_id"

    candidate_tau:
      - 0.0001
      - 0.001
      - 0.01
      - 0.1
      - 1.0
      - 10.0
      - 100.0

    optimization_metric: "RMSE"

  weight_normalization:
    rule: "coefficient_divided_by_sum"

  zero_sum_fallback:
    rule: "equal_weights"


# ============================================================
# 6. Prediction reporting
# ============================================================

evaluation:

  primary_partition: "test"

  pooled_metrics:
    - "R2"
    - "MAE"
    - "RMSE"

  context_metrics:
    - "MeanContextMAE"
    - "MeanContextRMSE"


# ============================================================
# 7. Parallelisation
# ============================================================

parallelisation:

  xgboost_n_jobs: 1

  reason: >
    Replication-level parallelism will be handled externally
    to avoid nested-thread oversubscription.

  replication_parallelism:

    library: "joblib"

    enabled_during_pilot: false

    enabled_during_full_experiment: true

# ============================================================
# 8. TreeSHAP scientific computation contract
# Frozen before the first scientific SHAP weight vector.
# ============================================================

treeshap_computation:

  status: "frozen_before_first_scientific_shap_weight_vector"

  model_fit:
    feature_columns:
      - "g_C1"
      - "g_C2"
      - "g_C3"
      - "g_C4"
      - "g_C5"
      - "g_C6"
      - "g_C7"
      - "g_C8"
      - "g_C9"
      - "g_C10"
    target_column: "Y"
    fit_partition: "fit"
    row_sort_order:
      - "context_number"
      - "alternative_id"
    frozen_parameter_source: "frozen_parameters"
    estimator_random_state_registry_key: "xgboost_production.estimator_random_state"
    estimator_random_state: 82002
    reuse_same_estimator_random_state_across_all_fits: true
    early_stopping: false
    eval_set: null
    weight_partition_used_for_model_fit: false
    external_test_used_for_model_fit: false

  background:
    constructor: "src/treeshap_background_v1.py"
    target_size: 100
    source_partition: "fit"
    feature_order_matches_model: true

  explanation:
    partition: "weight"
    row_sort_order:
      - "context_number"
      - "alternative_id"
    api: "shap.TreeExplainer.__call__"
    values_source: "Explanation.values"
    base_values_source: "Explanation.base_values"
    feature_perturbation: "interventional"
    model_output: "raw"
    external_test_used_for_shap_weight_estimation: false

  local_accuracy:
    invariant: true
    reconstructed_prediction: "base_values_plus_row_sum_shap_values"
    comparator: "XGBRegressor.predict_on_same_WEIGHT_rows"
    absolute_tolerance: 1.0e-5
    relative_tolerance: 1.0e-5
    elementwise_rule: "abs_error_le_atol_plus_rtol_times_abs_prediction"
    failure_action: "raise_numerical_error_and_emit_no_shap_weights"
    record_max_absolute_error: true
    record_max_scaled_error: true

  global_importance:
    definition: "mean_absolute_shap"
    averaging_unit: "WEIGHT_alternative_context_row"
    criterion_count: 10
    nonnegative_by_definition: true

  weight_normalization:
    rule: "importance_divided_by_total_importance"
    epsilon: 1.0e-12
    valid_if_total_importance_strictly_greater_than_epsilon: true
    zero_or_near_zero_policy: "undefined_shap_weight_vector"
    equal_weight_fallback: false
    downstream_shap_mcdm_when_undefined: "not_computed"
    continue_other_methods_when_undefined: true
    record_degeneracy_flag: true

  outputs:
    persist_global_importance: true
    persist_global_weights_when_defined: true
    persist_local_accuracy_diagnostics: true
    persist_background_identity_hash: true
    persist_fit_weight_background_row_counts: true
    persist_raw_row_level_shap_values_for_every_primary_instance: false
    raw_row_level_shap_values_may_be_retained_for_reference_diagnostics: true

  firewalls:
    external_test_used_for_model_fit: false
    external_test_used_for_background: false
    external_test_used_for_global_shap_weights: false
    oracle_attribution_used_to_modify_shap_weights: false
    mcdm_used_to_modify_shap_weights: false
    winner_identity_used_to_modify_shap_weights: false
    preferred_ITS_used_to_modify_shap_weights: false
